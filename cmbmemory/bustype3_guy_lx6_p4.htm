    <td width="100%">
      <p align="center"><b><font size="4" face="標楷體"><img border="0" src="./bustype3_guy_lx6_p4_files/lx261.jpg" width="640" height="436"></font></b></p>
      <p><b><font color="#FF0000" size="4" face="標楷體">LX261於1991年退役後，被改裝成為一台錢箱車，撥歸柴灣車廠管理。下層車窗加裝鐵絲網，「雞翼窗」仍然被保留著。雖然此車已登記成為一輛貨車，但中巴仍然保留此車的上層作員工接送車之用。</font></b></p>
      <hr>
      <p align="center"><b><font size="4" face="標楷體"><img border="0" src="./bustype3_guy_lx6_p4_files/lx316.jpg" width="639" height="426"></font></b></p>
      <hr>
      <p align="center"><b><font size="4" face="標楷體"><img border="0" src="./bustype3_guy_lx6_p4_files/lx316b.jpg" width="640" height="427"></font></b></p>
      <p><b><font color="#FF0000" size="4" face="標楷體">同樣地，LX316於1994年退役後，被改裝成為黃竹坑車廠的錢箱車。此車後來被新巴購入，現時仍然停泊在黃竹坑車廠頂層。</font></b></p>
      <hr>
      <p align="center"><b><font size="4" face="標楷體"><img border="0" src="./bustype3_guy_lx6_p4_files/lx287.jpg" width="640" height="440"></font></b></p>
      <p align="center"><font color="#FF0000" size="4" face="標楷體"><b>此車也是LX，被改裝成為一輛貨車，編號如沒記錯應是LX289吧....</b></font></p></td>
  </tr>
